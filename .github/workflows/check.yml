name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Unit and screen tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - run: gradle --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screen-renders, path: app/build/shots, if-no-files-found: ignore }

  phone:
    name: Run both builds on an Android emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Build the regular and the lean APK
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk regular.apk
          gradle --no-daemon :app:assembleRelease -Plean
          cp app/build/outputs/apk/release/app-release.apk lean.apk
          ls -la *.apk
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          script: |
            python3 ci/smoke.py regular.apk regular
            python3 ci/smoke.py lean.apk lean
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: phone-screenshots, path: shots, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: apks-debug-signed, path: "*.apk" }
